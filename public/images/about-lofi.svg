<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Ilustrasi lo-fi programmer di meja dengan lampu hangat">
  <rect width="800" height="600" fill="#ebe6da"/>
  <!-- window -->
  <rect x="80" y="60" width="360" height="280" fill="#141310"/>
  <rect x="92" y="72" width="336" height="256" fill="#23211c"/>
  <!-- night sky + moon -->
  <circle cx="340" cy="140" r="42" fill="#f4f1ea"/>
  <circle cx="328" cy="132" r="36" fill="#23211c"/>
  <!-- stars -->
  <g fill="#f4f1ea" opacity="0.8">
    <circle cx="130" cy="110" r="2.5"/><circle cx="180" cy="170" r="2"/>
    <circle cx="230" cy="110" r="2.5"/><circle cx="270" cy="200" r="2"/>
    <circle cx="150" cy="240" r="2"/><circle cx="210" cy="280" r="2.5"/>
  </g>
  <!-- city silhouette -->
  <g fill="#3f4a3a">
    <rect x="92" y="260" width="40" height="68"/><rect x="140" y="240" width="34" height="88"/>
    <rect x="182" y="270" width="44" height="58"/><rect x="234" y="248" width="30" height="80"/>
    <rect x="272" y="266" width="52" height="62"/><rect x="332" y="244" width="36" height="84"/>
    <rect x="376" y="270" width="52" height="58"/>
  </g>
  <g fill="#f4f1ea" opacity="0.55">
    <rect x="100" y="270" width="6" height="6"/><rect x="112" y="270" width="6" height="6"/>
    <rect x="148" y="250" width="6" height="6"/><rect x="148" y="264" width="6" height="6"/>
    <rect x="242" y="258" width="6" height="6"/><rect x="340" y="254" width="6" height="6"/>
  </g>
  <!-- rain -->
  <g stroke="#8a8478" stroke-width="2" opacity="0.5">
    <line x1="120" y1="120" x2="108" y2="150"/><line x1="200" y1="130" x2="188" y2="160"/>
    <line x1="300" y1="150" x2="288" y2="180"/><line x1="380" y1="170" x2="368" y2="200"/>
  </g>
  <!-- desk -->
  <rect x="40" y="420" width="560" height="18" fill="#141310"/>
  <rect x="70" y="438" width="16" height="120" fill="#141310"/>
  <rect x="554" y="438" width="16" height="120" fill="#141310"/>
  <!-- laptop -->
  <rect x="180" y="320" width="220" height="102" rx="6" fill="#141310"/>
  <rect x="190" y="330" width="200" height="74" fill="#f4f1ea"/>
  <g font-family="monospace" font-size="13" fill="#141310">
    <rect x="198" y="340" width="70" height="8" fill="#b3271a"/>
    <rect x="198" y="354" width="120" height="6" fill="#3f4a3a"/>
    <rect x="198" y="366" width="90" height="6" fill="#656056"/>
    <rect x="198" y="378" width="110" height="6" fill="#656056"/>
    <rect x="198" y="390" width="40" height="8" fill="#141310"/>
  </g>
  <rect x="165" y="422" width="250" height="10" rx="3" fill="#141310"/>
  <!-- lamp -->
  <rect x="480" y="240" width="14" height="182" fill="#141310"/>
  <rect x="440" y="228" width="110" height="20" rx="6" fill="#141310"/>
  <circle cx="495" cy="258" r="10" fill="#b3271a"/>
  <polygon points="440,262 550,262 495,360" fill="#b3271a" opacity="0.18"/>
  <!-- mug with steam -->
  <rect x="450" y="384" width="44" height="36" rx="4" fill="#f4f1ea" stroke="#141310" stroke-width="4"/>
  <path d="M494 390 h14 a10 10 0 0 1 0 24 h-14" fill="none" stroke="#141310" stroke-width="4"/>
  <g stroke="#656056" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M460 368 q6 -10 0 -20 q-6 -10 0 -20"/>
    <path d="M476 368 q6 -10 0 -20 q-6 -10 0 -20"/>
  </g>
  <!-- plant -->
  <rect x="90" y="380" width="52" height="40" fill="none" stroke="#141310" stroke-width="4"/>
  <g stroke="#3f4a3a" stroke-width="5" fill="none" stroke-linecap="round">
    <line x1="116" y1="380" x2="116" y2="344"/>
    <line x1="116" y1="360" x2="94" y2="342"/>
    <line x1="116" y1="360" x2="138" y2="342"/>
    <line x1="116" y1="348" x2="104" y2="328"/>
    <line x1="116" y1="348" x2="128" y2="328"/>
  </g>
  <!-- anime cat sleeping on desk -->
  <g>
    <ellipse cx="620" cy="412" rx="70" ry="20" fill="#141310" opacity="0.12"/>
    <rect x="560" y="376" width="120" height="44" rx="22" fill="#f4f1ea" stroke="#141310" stroke-width="5"/>
    <polygon points="574,380 566,356 590,372" fill="#f4f1ea" stroke="#141310" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="666,380 674,356 650,372" fill="#f4f1ea" stroke="#141310" stroke-width="5" stroke-linejoin="round"/>
    <line x1="600" y1="400" x2="614" y2="400" stroke="#141310" stroke-width="4" stroke-linecap="round"/>
    <line x1="628" y1="400" x2="642" y2="400" stroke="#141310" stroke-width="4" stroke-linecap="round"/>
    <circle cx="594" cy="394" r="3" fill="#b3271a"/><circle cx="648" cy="394" r="3" fill="#b3271a"/>
  </g>
  <!-- caption bar -->
  <rect x="40" y="520" width="560" height="2" fill="#141310"/>
</svg>
