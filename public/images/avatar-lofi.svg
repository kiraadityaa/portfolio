<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Avatar anime dengan headphone">
  <rect width="200" height="200" fill="#ebe6da"/>
  <!-- shoulders -->
  <path d="M40 200 c0 -40 28 -58 60 -58 s60 18 60 58 z" fill="#3f4a3a" stroke="#141310" stroke-width="6"/>
  <line x1="100" y1="160" x2="100" y2="200" stroke="#141310" stroke-width="4"/>
  <!-- neck -->
  <rect x="86" y="128" width="28" height="24" fill="#f4f1ea" stroke="#141310" stroke-width="5"/>
  <!-- face -->
  <ellipse cx="100" cy="102" rx="38" ry="42" fill="#f4f1ea" stroke="#141310" stroke-width="6"/>
  <!-- hair -->
  <path d="M60 96 c-2 -34 18 -52 40 -52 s42 18 40 52 c-8 -12 -12 -14 -14 -26 -8 8 -18 12 -26 12 s-18 -4 -26 -12 c-2 12 -6 14 -14 26 z" fill="#141310"/>
  <polygon points="68,88 74,108 82,88" fill="#141310"/>
  <polygon points="132,88 126,108 118,88" fill="#141310"/>
  <!-- eyes -->
  <line x1="80" y1="106" x2="92" y2="106" stroke="#141310" stroke-width="4" stroke-linecap="round"/>
  <line x1="108" y1="106" x2="120" y2="106" stroke="#141310" stroke-width="4" stroke-linecap="round"/>
  <circle cx="76" cy="114" r="4" fill="#b3271a"/>
  <circle cx="124" cy="114" r="4" fill="#b3271a"/>
  <!-- mouth -->
  <path d="M94 122 q6 6 12 0" fill="none" stroke="#141310" stroke-width="3.5" stroke-linecap="round"/>
  <!-- headphones -->
  <path d="M58 102 a42 42 0 0 1 84 0" fill="none" stroke="#141310" stroke-width="7" stroke-linecap="round"/>
  <rect x="50" y="92" width="18" height="34" rx="9" fill="#b3271a" stroke="#141310" stroke-width="5"/>
  <rect x="132" y="92" width="18" height="34" rx="9" fill="#b3271a" stroke="#141310" stroke-width="5"/>
  <!-- terminal badge -->
  <rect x="136" y="140" width="44" height="26" rx="4" fill="#141310"/>
  <text x="144" y="158" font-family="monospace" font-size="14" font-weight="bold" fill="#f4f1ea">$</text>
  <line x1="154" y1="154" x2="168" y2="154" stroke="#e0684f" stroke-width="3" stroke-linecap="round"/>
</svg>
